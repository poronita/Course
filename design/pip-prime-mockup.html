<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Pip Prime Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#071A21;--panel:#0E2A34;--mat:#041217;--dot:rgba(140,200,215,.09);--ink:#E8F6F8;--muted:#8DB3BE;--line:rgba(140,200,215,.18);--chip:#123340;--accent:#2BB3D1;--accent-ink:#042029;--focus:#6FD6EA;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#F3EBD7;--panel:#FFFCF4;--mat:#E8DDC3;--dot:rgba(90,70,30,.10);--ink:#18272D;--muted:#5E6F73;--line:rgba(60,50,30,.18);--chip:#F0E6CE;--accent:#0E7C99;--accent-ink:#fff;--focus:#0E7C99;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding:0 16px 28px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.x-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;max-width:1440px;margin:0 auto;padding:14px 0 12px}
.x-brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.x-brand h1{font:800 20px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.x-brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x-lbl{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.x-ctl{display:flex;align-items:center;gap:8px}
.x-seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px}
.x-seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--muted)}
.x-seg button[aria-checked="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.x-wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.x-stage{position:relative;border-radius:18px;background:var(--mat);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;height:min(78vh,900px);min-height:420px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.x-stage.is-web{height:min(70vh,820px)}
@media (max-width:600px){.x-stage{height:auto;min-height:0;padding:14px 0}}
.x-chip{position:absolute;left:14px;top:12px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
@media (max-width:600px){.x-chip{display:none}}
.x-fit{position:relative}
.x-device{position:absolute;left:0;top:0;transform-origin:0 0}
.x-device.is-app{width:414px;height:868px;border-radius:64px;background:#0b0d10;padding:12px;box-shadow:0 0 0 2px #2b2f37 inset,0 40px 80px -30px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4),0 0 0 2px rgba(255,255,255,.07)}
.x-device.is-web{width:1280px;height:800px;border-radius:14px;background:#dfe3e9;box-shadow:0 40px 90px -40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2);overflow:hidden}
.x-viewport{position:relative;overflow:hidden;background:#000}
.is-app .x-viewport{width:390px;height:844px;border-radius:52px}
.is-web .x-viewport{width:1280px;height:756px}
.x-chrome{display:none;height:44px;align-items:center;gap:14px;padding:0 14px;background:#e6e9ee;border-bottom:1px solid #cfd5dd;font:13px/1 var(--f-body);color:#3c4350}
:root:not([data-theme="light"]) .x-chrome{background:#1b2a31;border-bottom-color:#2a3d46;color:#b9d3db}
.is-web .x-chrome{display:flex}
.x-chrome .x-dots{display:flex;gap:7px}.x-chrome .x-dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.x-chrome .x-dots i:nth-child(2){background:#febc2e}.x-chrome .x-dots i:nth-child(3){background:#28c840}
.x-chrome .x-tab{background:#fff;color:#2b313b;border-radius:8px 8px 0 0;align-self:flex-end;padding:9px 14px;display:flex;gap:8px;align-items:center;font-weight:600;width:270px}
:root:not([data-theme="light"]) .x-chrome .x-tab{background:#0E2A34;color:#e8f6f8}
.x-chrome .x-tab b{width:14px;height:14px;border-radius:4px;background:#1B8CA8;display:inline-block;flex:none}
.x-chrome .x-tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-chrome .x-url{flex:1;max-width:640px;margin:0 auto 0 24px;background:#fff;color:#2b313b;border-radius:999px;padding:8px 14px;display:flex;gap:8px;align-items:center;font-weight:500}
:root:not([data-theme="light"]) .x-chrome .x-url{background:#0A1F27;color:#d3e7ec}
.x-chrome .x-url em{font-style:normal;color:#7a8291}
.x-sb{display:none;position:absolute;left:0;right:0;top:0;height:46px;z-index:1100;pointer-events:none;align-items:center;justify-content:space-between;padding:4px 30px 0 36px;font:600 15px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#111}
.is-app .x-sb{display:flex}
.x-sb.is-light{color:#fff}
.x-sb .x-ics{display:flex;gap:6px;align-items:center}
.x-island{display:none;position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:1101}
.is-app .x-island{display:block}
.x-homebar{display:none;position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#111;z-index:1101;opacity:.85}
.is-app .x-homebar{display:block}
.x-sb.is-light~.x-homebar{background:#fff}
.x-tl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.x-tl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.x-play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.x-tc{font:600 14px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:118px}
.x-tc span{color:var(--muted)}
.x-track{position:relative;flex:1 1 260px;min-width:0;height:44px;display:flex;align-items:center}
#scrub{appearance:none;-webkit-appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;position:relative;z-index:2;margin:0}
#scrub::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
#scrub::-moz-range-track{height:8px;border-radius:4px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
#scrub::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);margin-top:-6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent)}
.x-ticks{position:absolute;left:10px;right:10px;top:50%;height:18px;margin-top:-9px;pointer-events:none;z-index:1}
.x-ticks i{position:absolute;top:0;width:2px;height:18px;margin-left:-1px;background:var(--muted);opacity:.4;border-radius:1px}
.x-small-sel,.x-tog{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:600 13px/1 var(--f-mono);cursor:pointer}
.x-tog{font-family:var(--f-body);font-weight:700;color:var(--muted)}
.x-tog[aria-pressed="true"]{color:var(--ink)}
.x-chapters{display:flex;gap:4px;min-width:0}
.x-chapters button{flex-basis:0;min-width:0;border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.x-chapters b{font:600 11px/1 var(--f-mono);color:var(--muted)}
.x-chapters span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chapters button.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.x-chapters button.is-on b{color:inherit;opacity:.7}
@media (max-width:700px){.x-chapters{flex-wrap:wrap}.x-chapters button{flex:1 1 30% !important}}
.x-keys{font-size:12px;color:var(--muted);margin:0}
.x-keys kbd{font:600 11px/1 var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--chip)}
.x-notes{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted)}
.x-notes b{color:var(--ink)}
.isk-screen{position:relative;overflow:hidden;isolation:isolate}
.isk-screen *{box-sizing:border-box}
.isk-ptr{position:absolute;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform}
.isk-ptr .isk-dot{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(15,20,30,.35);box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 0 0 6px rgba(255,255,255,.35);transition:transform .12s,background .12s}
.isk-ptr.is-down .isk-dot{transform:scale(.8);background:rgba(255,255,255,.82)}
.isk-ptr .isk-arrow{position:absolute;left:-4px;top:-3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px;transition:transform .1s}
.isk-ptr.is-down .isk-arrow{transform:scale(.86)}
.isk-ripple{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(0,0,0,.2),inset 0 0 0 2px rgba(0,0,0,.12);opacity:0;transform:translate(-50%,-50%)}
.isk-confetti{position:absolute;left:0;top:0;z-index:900;pointer-events:none}
.isk-confetti i{position:absolute;left:0;top:0;border-radius:2px}
.isk-err{color:#b00;font:12px/1.4 var(--f-mono);white-space:pre-wrap;padding:60px 20px}
</style>
<div class="x-top">
  <div class="x-brand">
    <div id="brandmark" style="width:44px;height:44px;flex:none"></div>
    <div><h1>Image Swiss Knife · Pip Prime</h1><p>60-second walkthrough. Dark = Turkish blue, light = creamy white.</p></div>
  </div>
  <div class="x-ctl"><span class="x-lbl">Theme</span>
    <div class="x-seg" role="radiogroup" aria-label="Theme">
      <button id="th-dark" role="radio" aria-checked="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dark</button>
      <button id="th-light" role="radio" aria-checked="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>Light</button>
    </div></div>
  <div class="x-ctl"><span class="x-lbl">Display</span>
    <div class="x-seg" role="radiogroup" aria-label="Display">
      <button id="mode-app" role="radio" aria-checked="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>App</button>
      <button id="mode-web" role="radio" aria-checked="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Website</button>
    </div></div>
</div>
<div class="x-wrap">
  <div class="x-stage" id="stage">
    <div class="x-chip" id="mode-chip"></div>
    <div class="x-fit" id="fit"><div class="x-device is-app" id="device">
      <div class="x-chrome"><div class="x-dots"><i></i><i></i><i></i></div><div class="x-tab"><b></b><span id="tabtitle">Image Swiss Knife</span></div><div class="x-url"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="urlbar"><em>imageswissknife.com</em>/</span></div></div>
      <div class="x-viewport"><div id="screen-host"></div>
        <div class="x-sb" id="statusbar"><span>9:41</span><span class="x-ics"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>
        <div class="x-island"></div><div class="x-homebar"></div>
      </div></div></div>
  </div>
  <div class="x-tl">
    <div class="x-tl-row">
      <button class="x-play" id="play" aria-label="Pause"></button>
      <div class="x-tc" id="tc"></div>
      <div class="x-track"><div class="x-ticks" id="ticks"></div><input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline"></div>
      <select class="x-small-sel" id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button class="x-tog" id="loop" aria-pressed="true">Loop</button>
      <button class="x-tog" id="shuffle">Shuffle bars</button>
    </div>
    <div class="x-chapters" id="chapters"></div>
    <p class="x-keys"><kbd>Space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> step 1 s · <kbd>M</kbd> app or website · <kbd>T</kbd> theme</p>
  </div>
  <div class="x-notes" id="notes"></div>
</div>
<script>
/* ==========================================================================
   Image Swiss Knife — Style Lab engine
   Deterministic timeline: every style renders a pure function of time t
   (0..40 s), so pausing and scrubbing are exact. See design/CONTRACT.md.
   ========================================================================== */
const ISK = (() => {
  const DUR = 60;

  /* The shared 40-second story. Every style tells the same story so the
     eight directions can be compared moment by moment. */
  const SCENES = [
    { t: 0,  id: 'intro',   label: 'Meet Pip' },
    { t: 5,  id: 'pick',    label: 'Pick a photo' },
    { t: 11, id: 'shrink',  label: 'Shrink to 200 KB' },
    { t: 20, id: 'crop',    label: 'Crop photo to 1:1' },
    { t: 29, id: 'privacy', label: 'Where was it taken?' },
    { t: 36, id: 'gif',     label: 'Video to GIF' },
    { t: 43, id: 'rewards', label: 'Level up & awards' },
    { t: 48, id: 'done',    label: 'Done' },
    { t: 52, id: 'seo',     label: 'Found by search' },
  ];

  /* Story facts. Use these exact values so every style shows the same data. */
  const DATA = {};

  /* ---------------------------------------------------------------- math */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b) => (b <= a ? (t >= a ? 1 : 0) : clamp((t - a) / (b - a)));
  const ease = {
    lin: p => p,
    in: p => p * p * p,
    out: p => 1 - Math.pow(1 - p, 3),
    inOut: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outQuart: p => 1 - Math.pow(1 - p, 4),
    outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
    outElastic: p => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
    spring: p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(11 * p)),
  };
  /* 0 before a, fades in over fi, holds, fades out over fo so it is 0 at b. */
  const win = (t, a, b, fi = 0.35, fo = 0.35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
  /* Tween a number between a and b. */
  const count = (t, a, b, from, to, fn = ease.out) => lerp(from, to, fn(seg(t, a, b)));
  const typed = (t, a, text, cps = 22) => text.slice(0, Math.max(0, Math.floor((t - a) * cps)));
  const fmtBytes = n => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const rng = seed => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const sceneAt = t => { let s = SCENES[0]; for (const x of SCENES) if (t >= x.t) s = x; return s; };

  /* ----------------------------------------------------------------- DOM */
  const el = (tag, cls, parent, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  };
  /* set(e, {x, y, s, sx, sy, r, o}) — transform + opacity in one call.
     Opacity 0 also hides the element so it cannot be "pointed at". */
  const set = (e, o) => {
    if (!e) return;
    let tr = '';
    if (o.x != null || o.y != null) tr += `translate(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px) `;
    if (o.r) tr += `rotate(${o.r.toFixed(2)}deg) `;
    if (o.s != null) tr += `scale(${o.s.toFixed(4)}) `;
    if (o.sx != null || o.sy != null) tr += `scale(${(o.sx ?? 1).toFixed(4)},${(o.sy ?? 1).toFixed(4)}) `;
    if (o.x != null || o.y != null || o.r != null || o.s != null || o.sx != null || o.sy != null) e.style.transform = tr || 'none';
    if (o.o != null) { e.style.opacity = o.o.toFixed(3); e.style.visibility = o.o <= 0.002 ? 'hidden' : 'visible'; }
  };
  const txt = (e, s) => { if (e && e.textContent !== s) e.textContent = s; };
  const html = (e, s) => { if (e && e._h !== s) { e._h = s; e.innerHTML = s; } };
  const cls = (e, name, on) => { if (e) e.classList.toggle(name, !!on); };

  /* --------------------------------------------------------------- icons */
  const ICONS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    shrink: '<path d="M4 4l6 6M10 5v5H5M20 20l-6-6M14 19v-5h5"/>',
    crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    convert: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    grid: '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
    share: '<path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
    save: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    next: '<path d="M9 5l7 7-7 7"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',

  const icon = (name, size = 24, stroke = 2) =>

  const pcache = new Map();

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">

<rect width="1200" height="900" fill="url(#s)"/><circle cx="1010" cy="150" r="58" fill="#fff6c9"/>
<path d="M120 170q40-26 80 0q40-26 80 0" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round" opacity=".85"/>
<rect y="470" width="1200" height="260" fill="url(#m)"/>
<path d="M0 ${560 + wv}q150 -30 300 0t300 0 300 0 300 0" stroke="#ffffff" stroke-width="8" fill="none" opacity=".6"/>
<path d="M0 ${650 - wv}q150 -24 300 0t300 0 300 0 300 0V740H0z" fill="#8fe0ea" opacity=".75"/>
<path d="M0 700q300-40 600-10t600 0V900H0z" fill="#f5d8a3"/>
<path d="M${kx} ${ky}l46 56-46 56-46-56z" fill="#ff5a5f"/><path d="M${kx} ${ky}v112M${kx - 46} ${ky + 56}h92" stroke="#fff" stroke-width="4"/>

<circle cx="${280 + k * 360}" cy="${700 - Math.abs(Math.sin(k * Math.PI * 3)) * 140}" r="26" fill="#ffcf3f"/><path d="M${254 + k * 360} ${700 - Math.abs(Math.sin(k * Math.PI * 3)) * 140}h52" stroke="#ff7a3d" stroke-width="7"/></svg>`;

  const photo = (name, opts = {}) => {
    const key = name + JSON.stringify(opts, (k, v) => (typeof v === 'number' ? Math.round(v * 100) / 100 : v));
    let u = pcache.get(key);
    if (!u) { u = svgURL(PHOTO[name] ? PHOTO[name](opts) : PHOTO.abstract(opts)); pcache.set(key, u); }

  };
  /* Animated video frame i of n (beach clip). */
  const frame = (i, n = 12) => photo('beach', { k: (i % n) / n });

  /* --------------------------------------------------------- confetti etc */
  function makeConfetti(parent, opt = {}) {
    const n = opt.count ?? 60, colors = opt.colors ?? ['#ff5a5f', '#ffcf3f', '#2bc48a', '#3d8bff', '#b36bff'];
    const ox = opt.x ?? 0, oy = opt.y ?? 0, dur = opt.dur ?? 2.6, g = opt.gravity ?? 900, kind = opt.shape || 'rect';
    const r = rng(opt.seed ?? 11);
    const box = el('div', 'isk-confetti', parent);
    const parts = [];
    const STAR = 'polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
    const HEART = "path('M6 11C-4 4 2 -2 6 2C10 -2 16 4 6 11Z')";
    for (let i = 0; i < n; i++) {
      const p = el('i', '', box), col = colors[i % colors.length];
      p.style.background = col;
      const a = (opt.spread ?? Math.PI * 0.9) * (r() - 0.5) - Math.PI / 2, v = (opt.power ?? 650) * (0.45 + r() * 0.75);
      const shape = r();
      if (kind === 'star') { const s = 9 + r() * 8; p.style.width = p.style.height = s + 'px'; p.style.clipPath = STAR; }
      else if (kind === 'ring') { const s = 8 + r() * 8; p.style.width = p.style.height = s + 'px'; p.style.background = 'transparent'; p.style.border = `2px solid ${col}`; p.style.borderRadius = '50%'; }
      else if (kind === 'coin') { p.style.width = p.style.height = '13px'; p.style.borderRadius = '50%'; p.style.background = `radial-gradient(circle at 35% 30%,#fff7b8,${col} 55%,rgba(0,0,0,.28))`; }
      else if (kind === 'heart') { p.style.width = p.style.height = '12px'; p.style.clipPath = HEART; }
      else if (kind === 'petal') { p.style.width = '8px'; p.style.height = '13px'; p.style.borderRadius = '0 100% 0 100%'; }
      else if (kind === 'spark') { p.style.width = '2px'; p.style.height = (8 + r() * 10) + 'px'; p.style.borderRadius = '2px'; }
      else {
        p.style.width = (shape > 0.5 ? 8 : 6) + 'px';
        p.style.height = (shape > 0.5 ? 12 : 6) + 'px';
        if (shape < 0.25) p.style.borderRadius = '50%';
      }
      parts.push({ p, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vr: (r() - 0.5) * (kind === 'spark' ? 0 : 900), a });
    }
    return {
      el: box,
      /* dt = seconds since burst. Hidden before 0 and after dur. */
      update(dt) {
        const on = dt >= 0 && dt <= dur;
        box.style.display = on ? '' : 'none';
        if (!on) return;
        const fade = 1 - seg(dt, dur * 0.65, dur);
        for (const q of parts) {
          const x = ox + q.vx * dt, y = oy + q.vy * dt + 0.5 * g * dt * dt;
          const rot = kind === 'spark' ? (Math.atan2(q.vy + g * dt, q.vx) * 180 / Math.PI + 90) : q.vr * dt;
          q.p.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(0)}deg)`;
          q.p.style.opacity = fade.toFixed(2);
        }
      },
    };
  }

  /* --------------------------------------------------------------- pointer
     keys: [{ t, at, ax, ay, dx, dy, tap, hold, drag, move }]
       at   element | selector (inside screen) | {x,y} | () => {x,y}
       ax/ay anchor inside the element (0..1, default .5)
       tap  show a press + ripple at t
       hold seconds to stay pressed after t
       drag pressed while travelling from the previous key to this one
       move travel time in seconds into this key (default .75)            */
  function makePointer(ctx, keys) {
    keys = keys.slice().sort((a, b) => a.t - b.t);
    const finger = ctx.mode === 'app';
    const p = el('div', 'isk-ptr ' + (finger ? 'is-finger' : 'is-cursor'), ctx.screen);
    p.innerHTML = '<i class="isk-ripple"></i>' + (finger ? '<b class="isk-dot"></b>' :
      '<svg class="isk-arrow" width="26" height="26" viewBox="0 0 26 26"><path d="M3 2l18 10.5-7.6 1.6 4.4 8.2-3.6 1.8-4.3-8.2L4.3 21z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>');
    const rip = p.firstChild;
    const cache = new Map();
    const resolve = (k, i) => {
      let pos = null;
      const tgt = typeof k.at === 'string' ? ctx.screen.querySelector(k.at) : k.at;
      if (typeof tgt === 'function') pos = tgt();
      else if (tgt && tgt.getBoundingClientRect) {
        const r = tgt.getBoundingClientRect(), s = ctx.screen.getBoundingClientRect(), sc = s.width / ctx.W || 1;
        if (r.width > 0 || r.height > 0) pos = { x: (r.left - s.left + r.width * (k.ax ?? 0.5)) / sc, y: (r.top - s.top + r.height * (k.ay ?? 0.5)) / sc };
      } else if (tgt && tgt.x != null) pos = { x: tgt.x, y: tgt.y };
      if (pos) { pos = { x: pos.x + (k.dx || 0), y: pos.y + (k.dy || 0) }; cache.set(i, pos); }
      return pos || cache.get(i) || { x: ctx.W / 2, y: ctx.H * 0.7 };
    };
    /* Pure position of the pointer at time t: { x, y, vis (0..1), down (bool), ripQ (-1 or 0..1) }. */
    const locate = t => {
      if (!keys.length) return { x: ctx.W / 2, y: ctx.H / 2, vis: 0, down: false, ripQ: -1 };
      const first = keys[0], last = keys[keys.length - 1];
      let vis = win(t, first.t - 0.7, last.t + (last.hold || 0) + 0.9, 0.3, 0.4);
      let pos, pressed = false;
      if (t <= first.t) {
        const a = resolve(first, 0);
        const q = ease.out(seg(t, first.t - 0.7, first.t - 0.1));
        pos = { x: a.x + (1 - q) * 40, y: a.y + (1 - q) * 70 };
      } else {
        let i = 0;
        while (i < keys.length - 1 && t >= keys[i + 1].t) i++;
        if (i >= keys.length - 1) pos = resolve(last, keys.length - 1);
        else {
          const a = keys[i], b = keys[i + 1];
          const depart = a.t + (a.hold || 0) + 0.12;
          const st = Math.max(depart, b.t - (b.move ?? 0.75));
          if (b.t - depart > 2.2 && !b.drag) {
            /* Long idle gap: lift the finger away, then bring it back near the next target. */
            const out = seg(t, depart + 0.25, depart + 0.55), back = seg(t, b.t - 0.75, b.t - 0.45);
            vis *= Math.max(1 - out, back);
            if (t < b.t - 0.75) pos = resolve(a, i);
            else {
              const B = resolve(b, i + 1), q = ease.out(seg(t, b.t - 0.75, b.t - 0.1));
              pos = { x: B.x + (1 - q) * 40, y: B.y + (1 - q) * 70 };
            }
          } else {
            const q = ease.inOut(seg(t, st, b.t));
            const A = resolve(a, i), B = resolve(b, i + 1);
            pos = { x: lerp(A.x, B.x, q), y: lerp(A.y, B.y, q) };
            if (b.drag && t >= st - 0.08) pressed = true;
          }
        }
      }
      let ripQ = -1;
      keys.forEach(k => {
        if ((k.tap || k.hold || k.drag) && t >= k.t - 0.08 && t <= k.t + Math.max(0.16, k.hold || 0)) pressed = true;
        if (k.tap && t >= k.t && t <= k.t + 0.55) ripQ = seg(t, k.t, k.t + 0.55);
      });
      return { x: pos.x, y: pos.y, vis, down: pressed, ripQ };
    };
    return {
      locate,
      update(t) {
        if (!keys.length) return;
        const s = locate(t);
        p.style.opacity = s.vis.toFixed(3);
        p.style.display = s.vis <= 0.001 ? 'none' : '';
        if (s.vis <= 0.001) return;
        p.style.transform = `translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px)`;
        p.classList.toggle('is-down', s.down);
        if (s.ripQ >= 0) { rip.style.opacity = (1 - s.ripQ).toFixed(2); rip.style.transform = `translate(-50%,-50%) scale(${(0.3 + s.ripQ * 1.7).toFixed(2)})`; }
        else rip.style.opacity = '0';
      },
    };
  }

  /* ===================================================================
     Round-2 toolkit: progress bars, screen transitions, "alive" helper.
     Everything is a pure function of its inputs (so scrubbing is exact).
     =================================================================== */
  const TAU = Math.PI * 2;
  /* Front-loaded easing: the bar jumps ahead early, so a wait feels shorter. */
  const rush = p => 1 - Math.pow(1 - clamp(p), 2.3);
  const hexA = (hex, a) => { let h = String(hex).replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h.slice(0, 6), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
  const rrPath = (c, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const BAR_KINDS = ['streams', 'liquid', 'orbit', 'tiles', 'comet', 'warp'];

  const DRAW = {
    /* Several mini bars race at different speeds, then merge into one bar. */

<script>
(() => {
  const $ = s => document.querySelector(s);
  const DUR = ISK.DUR, def = ISK.styles[0];
  const host = $('#screen-host'), device = $('#device'), fit = $('#fit'), stage = $('#stage');
  const scrub = $('#scrub'), playBtn = $('#play'), tc = $('#tc'), sb = $('#statusbar');
  let mode = 'app', theme = 'dark', t = 0, playing = true, speed = 1, looping = true, last = null, cur = null, wasPlaying = false;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { playing = false; t = 15; }
  try { const q = new URLSearchParams(location.hash.slice(1)); if (q.get('theme') === 'light') theme = 'light'; if (q.get('mode') === 'web') mode = 'web'; } catch (e) {}
  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>';
  const fmt = x => { const m = Math.floor(x / 60), s = x - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const ticks = $('#ticks'), chapters = $('#chapters');
  ISK.SCENES.forEach((s, i) => {
    const end = (ISK.SCENES[i + 1] || { t: DUR }).t;
    if (s.t > 0) { const k = document.createElement('i'); k.style.left = (s.t / DUR * 100) + '%'; ticks.appendChild(k); }
    const b = document.createElement('button');
    b.style.flexGrow = end - s.t;
    b.innerHTML = `<b>${fmt(s.t).replace('.0', '')}</b><span>${esc(s.label)}</span>`;
    b.addEventListener('click', () => { t = s.t + 0.01; render(); });
    chapters.appendChild(b);
  });
  $('#notes').innerHTML = (def.notes || []).map(n => `<b>${esc(n[0])}</b> ${esc(n[1])}`).join('<br>');

  function doFit() {
    const nw = mode === 'app' ? 414 : 1280, nh = mode === 'app' ? 868 : 800;
    const r = stage.getBoundingClientRect(), narrow = window.innerWidth <= 600;
    const aw = r.width - 28, ah = narrow ? (mode === 'app' ? 620 : 420) : r.height - 48;
    const sc = Math.max(0.1, Math.min(aw / nw, ah / nh, 1));
    device.style.transform = `scale(${sc})`;
    fit.style.width = (nw * sc) + 'px'; fit.style.height = (nh * sc) + 'px';
  }
  new ResizeObserver(doFit).observe(stage);

  function rebuild() { ISK.theme = theme; cur = ISK.mount(def, mode, host); render(); }
  function render() {
    if (!cur) return;
    cur.update(t);
    sb.classList.toggle('is-light', cur.statusBar(t) === 'light');
    const m = cur.meta(t);
    if (m) { $('#urlbar').innerHTML = `<em>imageswissknife.com</em>${esc(m.url)}`; $('#tabtitle').textContent = m.title; }
    scrub.value = t.toFixed(2);
    scrub.style.setProperty('--p', (t / DUR * 100) + '%');
    tc.innerHTML = `${fmt(t)} <span>/ 1:00</span>`;
    const sc = ISK.sceneAt(t);
    chapters.querySelectorAll('button').forEach((b, i) => b.classList.toggle('is-on', ISK.SCENES[i] === sc));
  }
  function setPlay(p) { playing = p; playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); if (p && t >= DUR - 0.01) t = 0; }
  function setMode(m) {
    mode = m; device.className = 'x-device is-' + m; stage.classList.toggle('is-web', m === 'web');
    $('#mode-app').setAttribute('aria-checked', m === 'app'); $('#mode-web').setAttribute('aria-checked', m === 'web');
    $('#mode-chip').textContent = m === 'app' ? 'Android app · 390 × 844' : 'Website · 1280 × 756';
    doFit(); rebuild(); save();
  }
  let brand = null;
  function setTheme(th) {
    theme = th; document.documentElement.dataset.theme = th;
    $('#th-dark').setAttribute('aria-checked', th === 'dark'); $('#th-light').setAttribute('aria-checked', th === 'light');
    const bm = $('#brandmark'); bm.innerHTML = '';
    const cdef = CAST.chars.find(c => c.id === (th === 'dark' ? 'pip-dark' : 'pip-light'));
    brand = CAST.mount(cdef, bm); brand.update({ t: 0, mood: 'idle', mt: 9, prev: 'idle', blend: 1, look: { x: 0, y: 0 }, poke: 1e9, pokes: 0, hover: false, small: true });
    if (cur) rebuild(); save();
  }
  function save() { try { history.replaceState(null, '', '#mode=' + mode + '&theme=' + theme); } catch (e) {} }
  $('#mode-app').addEventListener('click', () => setMode('app'));
  $('#mode-web').addEventListener('click', () => setMode('web'));
  $('#th-dark').addEventListener('click', () => setTheme('dark'));
  $('#th-light').addEventListener('click', () => setTheme('light'));
  playBtn.addEventListener('click', () => setPlay(!playing));
  $('#shuffle').addEventListener('click', () => { ISK.variant++; rebuild(); });
  $('#speed').addEventListener('change', e => { speed = +e.target.value; });
  $('#loop').addEventListener('click', e => { looping = !looping; e.currentTarget.setAttribute('aria-pressed', looping); });
  scrub.addEventListener('pointerdown', () => { wasPlaying = playing; setPlay(false); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying) setPlay(true); wasPlaying = false; });
  scrub.addEventListener('input', () => { t = +scrub.value; render(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('select,input:not([type=range])')) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); setPlay(!playing); }
    else if (k === 'ArrowRight') { e.preventDefault(); t = Math.min(DUR, t + (e.shiftKey ? 5 : 1)); render(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); t = Math.max(0, t - (e.shiftKey ? 5 : 1)); render(); }

    else if (k === 'Home') { t = 0; render(); }
  });
  function tick(ts) {
    if (playing && last != null) {
      t += Math.min(0.1, (ts - last) / 1000) * speed;
      if (t >= DUR) { if (looping) t -= DUR; else { t = DUR; setPlay(false); } }
      render();
    }
    last = ts; requestAnimationFrame(tick);
  }
  window.__lab = { seek(x) { t = x; render(); }, pause() { setPlay(false); }, mode: setMode, theme: setTheme };
  setPlay(playing); setTheme(theme); setMode(mode); requestAnimationFrame(tick);
})();
